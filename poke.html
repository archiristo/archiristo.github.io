<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Uplink | archiristo_OS</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07080c;
            --panel: #0d0f15;
            --panel-alt: #10121a;
            --text: #dfe4ea;
            --muted: #6d7684;
            --amber: #ffb545;
            --cyan: #6eead0;
            --line: #1d2029;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(110, 234, 208, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(29, 32, 41, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(29, 32, 41, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Layout & Nav (Matched with Astro) --- */
        nav {
            border-bottom: 1px solid var(--line);
            background: rgba(7, 8, 12, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-family: 'Newsreader', serif;
            font-style: italic;
            font-size: 1.35rem;
            color: var(--text);
        }
        .brand i { color: var(--amber); font-style: normal; margin-right: 0.5rem; }
        .back-link {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--amber); }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 3.5rem; }

        .page-header { margin-bottom: 2.25rem; }
        .page-header h1 {
            font-family: 'Newsreader', serif;
            font-size: 2rem;
            font-weight: 500;
            font-style: italic;
            margin-bottom: 0.5rem;
        }
        .status-line {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--cyan);
            letter-spacing: 0.05em;
        }

        /* --- Grid & Cards --- */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 860px) { .layout-grid { grid-template-columns: 300px 1fr; } }

        .card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card::before, .card::after { content: ''; position: absolute; width: 10px; height: 10px; }
        .card::before { top: -1px; left: -1px; border-top: 2px solid var(--amber); border-left: 2px solid var(--amber); }
        .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--amber); border-right: 2px solid var(--amber); }

        .module-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 1rem;
            border-left: 2px solid var(--cyan);
            padding-left: 0.5rem;
        }

        /* --- Form Elements --- */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        input[type="text"] {
            background: var(--panel-alt);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 0.6rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--cyan); }
        
        button.action-btn {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 0.6rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        button.action-btn:hover { background: var(--cyan); color: var(--bg); }
        button.action-btn.amber { border-color: var(--amber); color: var(--amber); }
        button.action-btn.amber:hover { background: var(--amber); color: var(--bg); }

        /* --- TCG Results Grid --- */
        #loading-text {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .tcg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .tcg-item {
            background: var(--panel-alt);
            border: 1px solid var(--line);
            padding: 0.5rem;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
        }
        .tcg-item:hover {
            transform: translateY(-4px);
            border-color: var(--amber);
            box-shadow: 0 4px 20px rgba(255, 181, 69, 0.1);
        }
        .tcg-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .tcg-info {
            margin-top: 0.75rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
        }
        .tcg-info .name { color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tcg-info .hp { color: var(--cyan); font-size: 0.7rem; }

    </style>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <div class="brand"><i class="fas fa-satellite-dish"></i> TCG_Uplink</div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> ~/archiristo_OS</a>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1>Pokémon TCG Database</h1>
            <p class="status-line" id="connection-status">&gt; API CONNECTION ESTABLISHED</p>
        </header>

        <div class="layout-grid">
            <!-- Left Panel: Controls -->
            <div class="controls">
                <div class="card">
                    <div class="module-label">Query Module</div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Enter Pokémon name..." value="Mewtwo">
                        <button class="action-btn" onclick="searchCards()">Execute Query</button>
                    </div>
                </div>

                <div class="card">
                    <div class="module-label">Randomizer</div>
                    <p style="font-family: 'IBM Plex Mono'; font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem;">
                        Fetch a random legendary entity from the archive.
                    </p>
                    <button class="action-btn amber" style="width: 100%;" onclick="fetchRandom()">Fetch Random</button>
                </div>
            </div>

            <!-- Right Panel: Data Output -->
            <div class="output">
                <div id="loading-text">&gt; Fetching data payload...</div>
                <div class="tcg-grid" id="tcgGrid">
                    <!-- Cards will be injected here via JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const grid = document.getElementById('tcgGrid');
        const loadingText = document.getElementById('loading-text');
        const searchInput = document.getElementById('searchInput');

        // Render data to HTML
        function displayCards(cards) {
            grid.innerHTML = '';
            if (cards.length === 0) {
                grid.innerHTML = '<p style="font-family:\'IBM Plex Mono\'; color:var(--amber);">> 404: No entries found.</p>';
                return;
            }

            cards.forEach(card => {
                // Ensure card has an image before rendering
                if (card.images && card.images.small) {
                    grid.innerHTML += `
                        <div class="tcg-item">
                            <img src="${card.images.small}" alt="${card.name}" loading="lazy">
                            <div class="tcg-info">
                                <span class="name">${card.name}</span>
                                <span class="hp">${card.hp ? 'HP ' + card.hp : 'Trainer/Energy'}</span>
                            </div>
                        </div>
                    `;
                }
            });
        }

        // Search API
        // Search API
        function searchCards() {
            // Boşlukları temizleyelim ve güvenli hale getirelim
            let query = searchInput.value.trim() || 'Charizard';
            // Eğer boşluklu bir isimse (örn: Roaring Moon), aralarına URL formatı koyalım
            query = encodeURIComponent(query); 
            
            loadingText.style.display = 'block';
            loadingText.innerHTML = '> Fetching data payload...';
            grid.innerHTML = '';

            // Tırnak işaretlerini kaldırdık, daha güvenli bir sorgu atıyoruz
            fetch(`https://api.pokemontcg.io/v2/cards?q=name:${query}*&pageSize=12`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Sunucu Hatası: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    loadingText.style.display = 'none';
                    if (data && data.data) {
                        displayCards(data.data);
                    } else {
                        throw new Error("Veri formatı tanınmadı.");
                    }
                })
                .catch(error => {
                    loadingText.style.display = 'block';
                    loadingText.innerHTML = `<span style="color:var(--amber);">> System Error: ${error.message}</span>`;
                    console.error('TCG API Error:', error);
                });
        }

        // Fetch Random Legendary
        function fetchRandom() {
            const legendaries = ['Rayquaza', 'Lugia', 'Gengar', 'Darkrai', 'Arceus', 'Giratina', 'Snorlax'];
            const randomPoke = legendaries[Math.floor(Math.random() * legendaries.length)];
            searchInput.value = randomPoke;
            searchCards();
        }

        // Execute default search on load
        window.onload = searchCards;
    </script>

</body>
</html>
